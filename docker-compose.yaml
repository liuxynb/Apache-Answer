version: '3.8'

services:
  answer:
    build:
      context: .             # 构建上下文为当前目录
      dockerfile: Dockerfile
      args:
        GOPROXY: https://proxy.golang.com.cn,direct
    ports:
      - "9080:80"            # 本地 9080 映射到容器内 80 端口
    volumes:
      - .:/go/src/github.com/apache/answer  # 挂载本地代码到容器内部路径
      - answer-data:/data                   # 数据卷，用于保存上传等
    environment:
      - TIMEZONE=Asia/Shanghai
    working_dir: /go/src/github.com/apache/answer
    entrypoint: ["/entrypoint.sh"]          # 保持和 Dockerfile 一致的入口

volumes:
  answer-data:
